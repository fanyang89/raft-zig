[tools]
zig = "0.16.0"

[tasks.build]
description = "Build libelection"
run = "zig build"

[tasks.test]
description = "Run default ReleaseSafe tests"
run = "zig build test --summary all"

[tasks.test-debug]
description = "Run Debug tests"
run = "zig build test -Doptimize=Debug --summary all"

[tasks.test-release-safe]
description = "Run ReleaseSafe tests"
run = "zig build test -Doptimize=ReleaseSafe --summary all"

[tasks.test-installed-c-sdk]
description = "Test the installed SDK with the system C compiler"
run = "zig build test-installed-c-sdk --summary all"

[tasks.test-vip-bridge]
description = "Test the fenced VIP leadership bridge"
run = "zig build test-vip-bridge --summary all"

[tasks.demo-vip]
description = "Run the three-node fenced VIP demo"
run = [
  "zig build example --summary all",
  "bash tools/fetch_vip_manager.sh zig-out/vip-manager",
  "sudo -n bash demo/three_node_vip_demo.sh zig-out/bin/election-vip-bridge zig-out/bin/election-vip-fencer zig-out/vip-manager/vip-manager",
]

[tasks.fmt]
description = "Format Zig sources"
run = "zig fmt build.zig src"

[tasks.fmt-check]
description = "Check Zig formatting"
run = "zig fmt --check build.zig src"

[tasks.check]
description = "Run all required checks"
run = [
  "zig fmt --check build.zig src",
  "zig build --summary all",
  "zig build test -Doptimize=Debug --summary all",
  "zig build test -Doptimize=ReleaseSafe --summary all",
  "zig build test-installed-c-sdk --summary all",
]
