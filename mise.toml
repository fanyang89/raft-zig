[tools]
zig = "0.16.0"
cmake = "4.3.4"
ninja = "1.13.2"
actionlint = "1.7.12"

[tasks."deps:fetch"]
description = "Fetch Zig dependencies through proxy-aware clients"
run = '''
set -eu

command -v zigfetch > /dev/null

cache_root="${ZIG_GLOBAL_CACHE_DIR:-${XDG_CACHE_HOME:-$HOME/.cache}/zig}"
package_root="zig-pkg"
mkdir -p "$cache_root/p" "$cache_root/tmp" "$package_root"

fetch_package() {
    package="$1"
    url="$2"
    if [ -d "$package_root/$package" ]; then
        return
    fi

    zigfetch --no-dep "$url"
    test -d "$cache_root/p/$package"
    cp -a "$cache_root/p/$package" "$package_root/$package"
}

fetch_package grpc_lite-0.2.2-BcwY0OUFBQCU9XfyC7Y1xl4Pk86hlEH8-GFXAu-riWFJ https://codeload.github.com/fanyang89/grpc-lite/tar.gz/6c0209863dd57ee7cf139b976ae3d81298cda2a5
fetch_package libxev-0.0.0-86vtcxkOFACqPXUTAPuq5i0xpDYWU5G5RfrYQXxlUT26 https://codeload.github.com/mitchellh/libxev/tar.gz/b0650f082458226860ed7ab0fc7c9c73823c8950
fetch_package N-V-__8AAPOqVwAHvwAVJJjhhX72DyDtjWw--9WUZf3-uKRX https://codeload.github.com/nghttp2/nghttp2/tar.gz/68cb6900fde14c77f0cd7add0e094a862960eb99
fetch_package protobuf-5.0.0-0e82avKUKAAVwTWJzTIEZ14Fu0zC11_lElR8tE6H__y1 https://github.com/Arwalk/zig-protobuf/archive/1f6cb06156b3ff4f52f98bc14f829c0b8393a6fc.tar.gz
fetch_package marionette-0.6.0-jTrEFDEmGwAsls0lMrAb9uRDOWApe_5DSJkDfE6pTQwb https://codeload.github.com/sb2bg/marionette/tar.gz/refs/tags/v0.6.0
'''

[tasks.build]
description = "Build raft-zig"
run = "zig build"

[tasks.test]
description = "Run all tests"
run = "zig build test --summary all"

[tasks.test-upstream]
description = "Run all adapted upstream test suites"
run = "zig build test-upstream --summary all"

[tasks.test-upstream-etcd-raft]
description = "Run adapted etcd/raft tests"
run = "zig build test-upstream-etcd-raft --summary all"

[tasks.test-upstream-raft-rs]
description = "Run adapted raft-rs tests"
run = "zig build test-upstream-raft-rs --summary all"

[tasks.test-upstream-openraft]
description = "Run adapted OpenRaft tests"
run = "zig build test-upstream-openraft --summary all"

[tasks.test-upstream-hashicorp-raft]
description = "Run clean-room HashiCorp Raft tests"
run = "zig build test-upstream-hashicorp-raft --summary all"

[tasks.test-upstream-dragonboat]
description = "Run adapted Dragonboat tests"
run = "zig build test-upstream-dragonboat --summary all"

[tasks.test-release-safe]
description = "Run all tests with ReleaseSafe optimization"
run = "zig build test -Doptimize=ReleaseSafe --summary all"

[tasks.test-tsan]
description = "Run all tests with ThreadSanitizer"
run = "TSAN_OPTIONS=halt_on_error=1:exitcode=66 zig build test -Dtarget=x86_64-linux-gnu -Doptimize=ReleaseSafe -Dsanitize-thread=true -Dsanitize-c=false --summary all"

[tasks.test-ubsan]
description = "Run all tests with C undefined behavior detection"
run = "UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 zig build test -Doptimize=Debug -Dsanitize-thread=false -Dsanitize-c=true --summary all"

[tasks.fuzz-smoke]
description = "Run fuzz corpus smoke tests"
run = "zig build fuzz-smoke --summary all"

[tasks.fuzz-codec]
description = "Fuzz RPC codecs"
run = "scripts/run-fuzz.sh fuzz-codec 100K"

[tasks.fuzz-wal]
description = "Fuzz WAL decoders"
run = "scripts/run-fuzz.sh fuzz-wal 100K"

[tasks.fuzz-confchange]
description = "Fuzz configuration change codecs"
run = "scripts/run-fuzz.sh fuzz-confchange 100K"

[tasks.fuzz-sim]
description = "Fuzz deterministic cluster simulation"
run = "scripts/run-fuzz.sh fuzz-sim 10K"

[tasks.fuzz-wal-crash]
description = "Fuzz WAL crash recovery on Marionette SimDisk"
run = "scripts/run-fuzz.sh fuzz-wal-crash 1K"

[tasks.vopr-smoke]
description = "Run Marionette integration smoke tests"
run = "zig build vopr-smoke --summary all"

[tasks.wal-durability]
description = "Run Marionette WAL durability tests"
run = "zig build wal-durability --summary all"

[tasks.fmt]
description = "Format Zig sources"
run = "zig fmt build.zig src examples tests"

[tasks.fmt-check]
description = "Check Zig formatting"
run = "zig fmt --check build.zig src examples tests"

[tasks.ci-lint]
description = "Validate GitHub Actions workflows"
run = "actionlint"

[tasks.check]
description = "Run formatting and tests"
run = "mise run fmt-check && mise run test"
