name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4

      - name: Check formatting
        run: mise run fmt-check

      - name: Validate workflows
        run: mise run ci-lint

  core-test:
    name: Core (${{ matrix.arch }}, ${{ matrix.optimize }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            optimize: Debug
            runner: ubuntu-24.04
          - arch: x86_64
            optimize: ReleaseSafe
            runner: ubuntu-24.04
          - arch: aarch64
            optimize: Debug
            runner: ubuntu-24.04-arm
          - arch: aarch64
            optimize: ReleaseSafe
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4

      - name: Test
        run: zig build test -Doptimize=${{ matrix.optimize }} --summary all

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4

      - name: Install kcov
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils-dev \
            cmake \
            libcurl4-openssl-dev \
            libdw-dev \
            libiberty-dev \
            libssl-dev \
            ninja-build \
            zlib1g-dev
          curl --fail --location --silent --show-error \
            --output /tmp/kcov-source.tar.gz \
            https://github.com/SimonKagstrom/kcov/archive/a39874f938ce13f7a65f253120d1ec946b349ffe.tar.gz
          echo 'dac01569171979477b500924be264d2a1bc649dae6010536228cbb319344d516  /tmp/kcov-source.tar.gz' | sha256sum --check
          mkdir /tmp/kcov-source
          tar --extract --gzip --file /tmp/kcov-source.tar.gz --directory /tmp/kcov-source --strip-components=1
          cmake -S /tmp/kcov-source -B /tmp/kcov-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/kcov-build
          sudo cmake --install /tmp/kcov-build

      - name: Generate coverage
        run: mise run coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: zig-out/coverage/kcov-merged/cobertura.xml
          use_oidc: true

  raft-sqlite-example:
    name: raft-sqlite example
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4

      - name: Test example
        run: mise run test-raft-sqlite

  libelection-example:
    name: libelection C SDK example
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4

      - name: Test example
        run: mise run test-libelection

  sanitizer:
    name: Sanitizer (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: TSan
            task: test-tsan
          - name: UBSan
            task: test-ubsan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4

      - name: Run sanitizer tests
        run: mise run ${{ matrix.task }}

  gperftools:
    name: Gperftools
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4

      - name: Run gperftools tests
        run: mise run test-gperftools

  fuzz:
    name: Fuzz (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: codec
            runs: 100K
          - target: wal
            runs: 100K
          - target: confchange
            runs: 100K
          - target: sim
            runs: 10K
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4

      - name: Run bounded fuzzing
        run: scripts/run-fuzz.sh fuzz-${{ matrix.target }} ${{ matrix.runs }}

      - name: Upload fuzz failure artifacts
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: fuzz-${{ matrix.target }}-failure
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            crash-*
            leak-*
            oom-*
            timeout-*
            .zig-cache/f/**
            .zig-cache/tmp/libfuzzer.log

  wal-durability:
    name: WAL durability and crash fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4

      - name: Test WAL durability
        run: mise run wal-durability

      - name: Run bounded WAL crash fuzzing
        run: mise run fuzz-wal-crash

      - name: Upload WAL crash failure artifacts
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: fuzz-wal-crash-failure
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            crash-*
            leak-*
            oom-*
            timeout-*
            .zig-cache/f/**
            .zig-cache/tmp/libfuzzer.log

  required:
    name: Required
    if: always()
    needs:
      - workflow-lint
      - core-test
      - coverage
      - raft-sqlite-example
      - libelection-example
      - sanitizer
      - gperftools
      - fuzz
      - wal-durability
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
          CORE_TEST_RESULT: ${{ needs.core-test.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          RAFT_SQLITE_EXAMPLE_RESULT: ${{ needs.raft-sqlite-example.result }}
          LIBELECTION_EXAMPLE_RESULT: ${{ needs.libelection-example.result }}
          SANITIZER_RESULT: ${{ needs.sanitizer.result }}
          GPERFTOOLS_RESULT: ${{ needs.gperftools.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
          WAL_DURABILITY_RESULT: ${{ needs.wal-durability.result }}
        run: |
          test "$WORKFLOW_LINT_RESULT" = success
          test "$CORE_TEST_RESULT" = success
          test "$COVERAGE_RESULT" = success
          test "$RAFT_SQLITE_EXAMPLE_RESULT" = success
          test "$LIBELECTION_EXAMPLE_RESULT" = success
          test "$SANITIZER_RESULT" = success
          test "$GPERFTOOLS_RESULT" = success
          test "$FUZZ_RESULT" = success
          test "$WAL_DURABILITY_RESULT" = success
